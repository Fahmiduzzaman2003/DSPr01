# Render blueprint for the backend API.
# Render -> New -> Blueprint, point it at this repo, and it reads this file.
services:
  - type: web
    name: hsc-result-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Lock this to your Vercel URL once the frontend is deployed.
      - key: ALLOWED_ORIGINS
        value: "*"
